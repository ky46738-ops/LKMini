<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔗｜GitHub＋ChatGPT多帳號下拉入口｜MultiAccountPinnedGateway</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f5f0;margin:0;padding:18px;color:#202124}.card{background:#fff;border-radius:18px;padding:22px;max-width:680px;margin:auto;box-shadow:0 4px 24px #0002}h1{font-size:21px;margin-top:0}.sub{color:#666;font-size:14px}.section{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:14px 0}.field{margin:12px 0}label{display:block;font-weight:750;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #d8dce1;border-radius:10px;font-size:16px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#2da44e;color:white;font-weight:800;font-size:15px}.btn.dark{background:#111}.btn.secondary{background:#f6f8fa;color:#24292f;border:1px solid #d8dee4}.btn.danger{background:#fff;color:#cf222e;border:1px solid #f1b8bc}.drop{border:2px dashed #c8ccd0;border-radius:12px;padding:20px;position:relative}.drop input{position:absolute;inset:0;opacity:0}.item{padding:10px;background:#f6f8fa;border-radius:9px;margin:7px 0}.ok{color:#1a7f37}.err{color:#cf222e}.muted{font-size:12px;color:#6e7781}.preview img,.preview video{max-width:100%;border-radius:12px}.preview iframe{width:100%;height:420px;border:1px solid #ddd;border-radius:12px}.log,.preview{margin-top:15px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>🔗｜GitHub＋ChatGPT 多帳號下拉入口</h1>
<p class="sub">先選帳號，再工作。GitHub 可在這台裝置保存多組 Token；ChatGPT 只保存帳號標籤，不保存密碼、Cookie 或登入憑證。</p>
<div class="section"><label>👤｜帳號組合｜Account Profile</label><select id="profileSelect"></select><div class="row" style="margin-top:9px"><button class="btn secondary" id="newProfile" type="button">➕｜新增帳號組合</button><button class="btn danger" id="deleteProfile" type="button">🗑️｜刪除目前組合</button></div></div>
<div class="section"><label>🤖｜ChatGPT 帳號｜ChatGPT Account</label><select id="chatgptSelect"></select><div class="row" style="margin-top:9px"><button class="btn secondary" id="addChatgpt" type="button">➕｜新增 ChatGPT 標籤</button><button class="btn dark" id="openChatgpt" type="button">🗂️｜用此帳號開 ChatGPT</button></div><div class="muted" id="chatgptHint" style="margin-top:8px"></div></div>
<div class="section"><label>🐙｜GitHub 帳號｜GitHub Account</label><select id="githubSelect"></select><div class="row" style="margin-top:9px"><button class="btn secondary" id="addGithub" type="button">➕｜新增 GitHub 帳號</button><button class="btn secondary" id="openGithub" type="button">👁️｜開啟 GitHub</button></div><div class="field"><label>🔑｜目前帳號 Token</label><input type="password" id="token" autocomplete="off" placeholder="GitHub Personal Access Token"></div><div class="row"><button class="btn secondary" id="saveToken" type="button">📌｜儲存此帳號 Token</button><button class="btn danger" id="forgetToken" type="button">🧹｜清除此帳號 Token</button></div><div class="muted" style="margin-top:8px">Token 只會存在這台裝置的瀏覽器 localStorage；請勿在公用裝置儲存。</div></div>
<div class="section"><div class="field"><label>📁｜目標資料夾｜Target Folder</label><input id="folder" value="assets/uploads" placeholder="assets/uploads"></div><div class="drop"><input type="file" id="files" multiple><b>📦｜選擇檔案｜Choose Files</b><div id="names">尚未選擇</div></div><div class="preview" id="preview"></div><button class="btn" id="uploadBtn" type="button" style="margin-top:12px">🚀｜用目前 GitHub 帳號上傳</button><div class="log" id="log"></div></div>
</div>
<script>
const OWNER='ky46738-ops',REPO='LKMini',BRANCH='seed_v0.1';const STORE='LKMINI_MULTI_ACCOUNT_GATEWAY_v1';const $=id=>document.getElementById(id);const defaultState={activeProfile:'主要',profiles:{'主要':{chatgpt:'ChatGPT 主要帳號',github:'GitHub 主要帳號'}},chatgptAccounts:{'ChatGPT 主要帳號':{hint:'請確認瀏覽器目前登入的是這個 ChatGPT 帳號'}},githubAccounts:{'GitHub 主要帳號':{username:'ky46738-ops',token:''}}};let state=load();function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{let v=JSON.parse(localStorage.getItem(STORE)||'null');return v&&v.profiles?v:clone(defaultState)}catch(_){return clone(defaultState)}}function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(_){}}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function add(m,c=''){$('log').insertAdjacentHTML('beforeend',`<div class="item ${c}">${m}</div>`)}function options(sel,obj,current){sel.innerHTML='';Object.keys(obj).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;if(k===current)o.selected=true;sel.appendChild(o)})}function activeProfile(){return state.profiles[state.activeProfile]}function render(){options($('profileSelect'),state.profiles,state.activeProfile);let p=activeProfile();options($('chatgptSelect'),state.chatgptAccounts,p.chatgpt);options($('githubSelect'),state.githubAccounts,p.github);let ga=state.githubAccounts[p.github]||{};$('token').value=ga.token||'';$('chatgptHint').textContent=(state.chatgptAccounts[p.chatgpt]||{}).hint||'此頁只保存帳號標籤；真正登入狀態由 ChatGPT/瀏覽器管理。'}$('profileSelect').onchange=e=>{state.activeProfile=e.target.value;save();render()};$('chatgptSelect').onchange=e=>{activeProfile().chatgpt=e.target.value;save();render()};$('githubSelect').onchange=e=>{activeProfile().github=e.target.value;save();render()};$('newProfile').onclick=()=>{let n=prompt('新帳號組合名稱，例如：公司／私人／備用');if(!n||!n.trim())return;n=n.trim();if(state.profiles[n])return alert('這個名稱已存在');let p=activeProfile();state.profiles[n]={chatgpt:p.chatgpt,github:p.github};state.activeProfile=n;save();render()};$('deleteProfile').onclick=()=>{if(Object.keys(state.profiles).length<=1)return alert('至少保留一個帳號組合');let n=state.activeProfile;if(!confirm(`刪除帳號組合「${n}」？`))return;delete state.profiles[n];state.activeProfile=Object.keys(state.profiles)[0];save();render()};$('addChatgpt').onclick=()=>{let n=prompt('ChatGPT 帳號標籤，例如：工作帳號／私人帳號');if(!n||!n.trim())return;n=n.trim();if(!state.chatgptAccounts[n])state.chatgptAccounts[n]={hint:'請在瀏覽器確認已登入此 ChatGPT 帳號'};activeProfile().chatgpt=n;save();render()};$('addGithub').onclick=()=>{let n=prompt('GitHub 帳號標籤，例如：公司 GitHub／私人 GitHub');if(!n||!n.trim())return;n=n.trim();let u=prompt('GitHub username（可留空）')||'';if(!state.githubAccounts[n])state.githubAccounts[n]={username:u.trim(),token:''};activeProfile().github=n;save();render()};$('saveToken').onclick=()=>{let p=activeProfile(),g=state.githubAccounts[p.github];g.token=$('token').value.trim();save();add(`✅｜已儲存 ${esc(p.github)} 的 Token｜Saved`,'ok')};$('forgetToken').onclick=()=>{let p=activeProfile(),g=state.githubAccounts[p.github];g.token='';$('token').value='';save();add(`🧹｜已清除 ${esc(p.github)} 的 Token｜Forgotten`,'ok')};$('openChatgpt').onclick=()=>{let p=activeProfile();window.open('https://chatgpt.com/','_blank','noopener');add(`🤖｜已開啟 ChatGPT｜請確認登入：${esc(p.chatgpt)}`,'ok')};$('openGithub').onclick=()=>{let p=activeProfile(),g=state.githubAccounts[p.github]||{};let u=g.username||OWNER;window.open(`https://github.com/${encodeURIComponent(u)}`,'_blank','noopener')};$('files').onchange=()=>{let fs=[...$('files').files];$('names').textContent=fs.map(f=>f.name).join('、')||'尚未選擇';$('preview').innerHTML='';fs.forEach(f=>{let u=URL.createObjectURL(f),t=f.type;if(t.startsWith('image/'))$('preview').insertAdjacentHTML('beforeend',`<div class="item">🖼️ ${esc(f.name)}<br><img src="${u}"></div>`);else if(t.startsWith('video/'))$('preview').insertAdjacentHTML('beforeend',`<div class="item">🎬 ${esc(f.name)}<br><video controls src="${u}"></video></div>`);else if(t==='application/pdf'||t==='text/html')$('preview').insertAdjacentHTML('beforeend',`<div class="item">👁️ ${esc(f.name)}<br><iframe src="${u}"></iframe></div>`);else $('preview').insertAdjacentHTML('beforeend',`<div class="item">📄 ${esc(f.name)}｜${f.size} bytes</div>`)})};function safeName(n){return n.normalize('NFC').replace(/[\?#%]/g,'_')}async function sha(path,t){let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}`,{headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json'}});if(r.status===404)return null;if(!r.ok)throw Error(`讀取既有檔案失敗 ${r.status}`);return (await r.json()).sha}function b64(buf){let a=new Uint8Array(buf),s='',step=0x8000;for(let i=0;i<a.length;i+=step)s+=String.fromCharCode(...a.subarray(i,i+step));return btoa(s)}async function put(path,file,t,old){let body={message:`📤｜上傳檔案｜Upload ${file.name}`,content:b64(await file.arrayBuffer()),branch:BRANCH};if(old)body.sha=old;let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURI(path)}`,{method:'PUT',headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(`GitHub寫入失敗 ${r.status}`);return r.json()}$('uploadBtn').onclick=async()=>{let p=activeProfile(),g=state.githubAccounts[p.github]||{},t=$('token').value.trim()||g.token||'',fs=[...$('files').files],folder=$('folder').value.trim().replace(/^\/+|\/+$/g,'');$('log').innerHTML='';if(!t)return add(`❌｜${esc(p.github)} 尚未設定 Token｜TokenRequired`,'err');g.token=t;save();if(!fs.length)return add('❌｜請選擇檔案｜FileRequired','err');$('uploadBtn').disabled=true;try{for(let f of fs){let path=(folder?folder+'/':'')+safeName(f.name);add(`📤｜${esc(p.github)} 正在上傳：${esc(path)}`);let old=await sha(path,t),j=await put(path,f,t,old);let page=`https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodeURI(path)}`;add(`✅｜寫入完成｜${esc(p.github)}<br>🔐｜Blob SHA｜${j.content.sha}<br><a target="_blank" href="${page}">👁️｜GitHub 畫面</a>`,'ok')}}catch(e){add(`❌｜錯誤｜${esc(e.message)}`,'err')}finally{$('uploadBtn').disabled=false}};render();
</script>
</body>
</html>
