<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔗｜GitHub＋ChatGPT帳號黏著入口｜AccountPinnedGateway</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f5f5f0;margin:0;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;max-width:620px;margin:auto;box-shadow:0 4px 24px #0002}h1{font-size:21px}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}.drop{border:2px dashed #ccc;border-radius:12px;padding:20px;position:relative}.drop input{position:absolute;inset:0;opacity:0}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#2da44e;color:white;font-weight:800}.log,.preview{margin-top:15px}.item{padding:10px;background:#f6f8fa;border-radius:9px;margin:7px 0}.ok{color:#1a7f37}.err{color:#cf222e}.preview img,.preview video{max-width:100%;border-radius:12px}.preview iframe{width:100%;height:420px;border:1px solid #ddd;border-radius:12px}</style></head><body><div class="card"><h1>🔗｜GitHub＋ChatGPT帳號黏著入口｜AccountPinnedGateway</h1><p>同一入口沿用 GitHub 授權與瀏覽器中的 ChatGPT 登入狀態；圖片、影片、PDF、HTML 上傳前可直接預覽。</p><div class="item ok">✅｜ChatGPT｜沿用目前瀏覽器登入帳號<br><small>ChatGPT Library 不把私人檔案 API 暴露給獨立 HTML；此入口以已登入的 ChatGPT 網頁工作階段開啟 Library。</small></div><button class="btn" id="chatgptBtn" type="button" style="background:#111;margin-bottom:10px">🗂️｜開啟 ChatGPT 檔案庫｜Open Library</button><div class="field"><label>🔑｜GitHub權杖｜GitHubToken</label><input type="password" id="token" autocomplete="off" placeholder="GitHub Personal Access Token"><label style="display:flex;gap:8px;align-items:center;font-weight:600;margin-top:8px"><input type="checkbox" id="remember" checked style="width:auto">📌｜在這台裝置記住 GitHub 授權</label><button type="button" id="forget" style="margin-top:8px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff">🧹｜清除已記住授權</button></div><div class="field"><label>📁｜目標資料夾｜TargetFolder</label><input id="folder" value="assets/uploads" placeholder="assets/uploads"></div><div class="drop"><input type="file" id="files" multiple><b>📦｜選擇檔案｜ChooseFiles</b><div id="names">尚未選擇</div></div><div class="preview" id="preview"></div><button class="btn" id="btn">🚀｜一鍵上傳｜UploadAll</button><div class="log" id="log"></div></div><script>const OWNER='ky46738-ops',REPO='LKMini',BRANCH='seed_v0.1';const TOKEN_KEY='LKMINI_GITHUB_TOKEN_v1';const $=id=>document.getElementById(id);
$('chatgptBtn').onclick=()=>window.open('https://chatgpt.com/library','_blank','noopener');
try{const saved=localStorage.getItem(TOKEN_KEY);if(saved)$('token').value=saved}catch(_){}
$('token').addEventListener('change',()=>{try{if($('remember').checked&&$('token').value.trim())localStorage.setItem(TOKEN_KEY,$('token').value.trim())}catch(_){}});
$('remember').addEventListener('change',()=>{try{if(!$('remember').checked)localStorage.removeItem(TOKEN_KEY);else if($('token').value.trim())localStorage.setItem(TOKEN_KEY,$('token').value.trim())}catch(_){}});
$('forget').onclick=()=>{try{localStorage.removeItem(TOKEN_KEY)}catch(_){}$('token').value='';add('🧹｜已清除這台裝置記住的 GitHub 授權｜Forgotten','ok')};const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function safeName(n){return n.normalize('NFC').replace(/[\?#%]/g,'_')}function add(m,c=''){ $('log').insertAdjacentHTML('beforeend',`<div class="item ${c}">${m}</div>`)}$('files').onchange=()=>{let fs=[...$('files').files];$('names').textContent=fs.map(f=>f.name).join('、')||'尚未選擇';$('preview').innerHTML='';fs.forEach(f=>{let u=URL.createObjectURL(f),t=f.type;if(t.startsWith('image/'))$('preview').insertAdjacentHTML('beforeend',`<div class="item">🖼️ ${esc(f.name)}<br><img src="${u}"></div>`);else if(t.startsWith('video/'))$('preview').insertAdjacentHTML('beforeend',`<div class="item">🎬 ${esc(f.name)}<br><video controls src="${u}"></video></div>`);else if(t==='application/pdf'||t==='text/html')$('preview').insertAdjacentHTML('beforeend',`<div class="item">👁️ ${esc(f.name)}<br><iframe src="${u}"></iframe></div>`);else $('preview').insertAdjacentHTML('beforeend',`<div class="item">📄 ${esc(f.name)}｜${f.size} bytes</div>`)});};async function sha(path,t){let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURI(path)}?ref=${BRANCH}`,{headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json'}});if(r.status===404)return null;if(!r.ok)throw Error(`讀取既有檔案失敗 ${r.status}`);return (await r.json()).sha}function b64(buf){let a=new Uint8Array(buf),s='',step=0x8000;for(let i=0;i<a.length;i+=step)s+=String.fromCharCode(...a.subarray(i,i+step));return btoa(s)}async function put(path,file,t,old){let body={message:`📤｜上傳檔案｜Upload ${file.name}`,content:b64(await file.arrayBuffer()),branch:BRANCH};if(old)body.sha=old;let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURI(path)}`,{method:'PUT',headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(`GitHub寫入失敗 ${r.status}`);return r.json()}$('btn').onclick=async()=>{let t=$('token').value.trim(),fs=[...$('files').files],folder=$('folder').value.trim().replace(/^\/+|\/+$/g,'');$('log').innerHTML='';if(!t)return add('❌｜請輸入GitHub權杖｜TokenRequired','err');try{if($('remember').checked)localStorage.setItem(TOKEN_KEY,t)}catch(_){}if(!fs.length)return add('❌｜請選擇檔案｜FileRequired','err');$('btn').disabled=true;try{for(let f of fs){let path=(folder?folder+'/':'')+safeName(f.name);add(`📤｜正在上傳｜Uploading：${esc(path)}`);let old=await sha(path,t),j=await put(path,f,t,old);let raw=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURI(path)}`;let page=`https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodeURI(path)}`;add(`✅｜寫入完成｜Written<br>🔐｜Blob SHA｜${j.content.sha}<br><a target="_blank" href="${page}">👁️｜GitHub畫面｜GitHubView</a><br><a target="_blank" href="${raw}">📦｜原始檔案｜RawFile</a>`,'ok')}}catch(e){add(`❌｜錯誤｜Error：${esc(e.message)}`,'err')}finally{$('btn').disabled=false}};</script></body></html>
