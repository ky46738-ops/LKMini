name: 🐙章魚貓開源守门人
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 检查必要文件是否存在
        run: |
          for f in README.md LICENSE NOTICE MANIFEST SHA256SUMS PUBLIC_PRIVATE_BOUNDARY.md; do
            if [ ! -f “$f” ]; then
              echo “失败: 缺少 $f”
              exit 1
            fi
          done
          echo “成功: 所有必要文件都存在”

      - name: 检查 A=A 标记
        run: |
          if ! grep -q “A_EQUALS_A=true” README.md; then
            echo “失败: README.md 中缺少 A=A 标记”
            exit 1
          fi
          echo “成功: 找到 A=A 标记”

      - name: 验证 SHA256SUMS（仅在 seed_v0.1 锁定之前为警告）
        run: |
          if grep -q “SHA256SUMS_STATUS=PLACEHOLDER” SHA256SUMS; then
            echo “警告: SHA256SUMS 仍然是占位符。跳过哈希验证。”
            echo “需要采取行动: 本地运行真实的 sha256sum 并推送更新后的 SHA256SUMS。”
          else
            sha256sum -c SHA256SUMS
            echo “成功: 所有哈希值都匹配”
          fi

      - name: 证据隔离区不可执行
        run: |
          if find evidence-quarantine -type f \( -name ‘*.sh’ -o -name ‘*.py’ -o -name ‘*.js’ -o -name ‘*.ts’ -o -name ‘*.exe’ -o -name ‘*.bin’ \) -print -quit 2>/dev/null | grep -q .; then
            echo “失败: 在 evidence-quarantine 中检测到可执行/脚本内容”
            exit 1
          fi
          echo “成功: evidence-quarantine 中不包含可执行/脚本文件类型”

      - name: 仅限所有者更改证据隔离区
        env:
          OWNER: ky46738-ops
        run: |
          if [ “${{ github.event_name }}” = “pull_request” ]; then
            ACTOR=“${{ github.event.pull_request.user.login }}”
          else
            ACTOR=“${{ github.actor }}”
          fi
          BASE=“${{ github.event.before }}”
          HEAD=“${{ github.sha }}”
          if [ “$BASE” = “0000000000000000000000000000000000000000” ]; then
            CHANGED=$(git show —pretty=‘’ —name-only “$HEAD”)
          else
            CHANGED=$(git diff —name-only “$BASE” “$HEAD” || true)
          fi
          if echo “$CHANGED” | grep -q ‘^evidence-quarantine/‘ && [ “$ACTOR” != “$OWNER” ]; then
            echo “失败: 证据隔离区被非所有者演员 $ACTOR 更改”
            exit 1
          fi
          echo “成功: 证据隔离区所有者检查”

      - name: 检查是否泄露了私有数据
        run: |
          if grep -r “PRIVATE_ENGINE\|ENGINE_REGISTRY_PRIVATE” —include=“*.md” —include=“*.json” .; then
            echo “失败: 在公共文件中发现私有标记”
            exit 1
          fi
          echo “成功: 没有泄露私有数据”
