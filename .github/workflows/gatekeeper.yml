name: Gatekeeper
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check required files exist
        run: |
          for f in README.md LICENSE NOTICE MANIFEST SHA256SUMS PUBLIC_PRIVATE_BOUNDARY.md; do
            if [ ! -f "$f" ]; then
              echo "FAIL: Missing $f"
              exit 1
            fi
          done
          echo "PASS: All required files exist"

      - name: Check A=A markers
        run: |
          if ! grep -q "A_EQUALS_A=true" README.md; then
            echo "FAIL: A=A marker missing in README.md"
            exit 1
          fi
          echo "PASS: A=A marker found"

      - name: Verify SHA256SUMS (warning only until seed_v0.1 locked)
        run: |
          if grep -q "SHA256SUMS_STATUS=PLACEHOLDER" SHA256SUMS; then
            echo "WARNING: SHA256SUMS is still a placeholder. Skipping hash verification."
            echo "ACTION REQUIRED: Run real sha256sum locally and push updated SHA256SUMS."
          else
            sha256sum -c SHA256SUMS
            echo "PASS: All hashes match"
          fi

      - name: Evidence quarantine is non-executable
        run: |
          if find evidence-quarantine -type f \( -name '*.sh' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.exe' -o -name '*.bin' \) -print -quit 2>/dev/null | grep -q .; then
            echo "FAIL: executable/script content detected in evidence-quarantine"
            exit 1
          fi
          echo "PASS: evidence-quarantine contains no executable/script file types"

      - name: Owner-only evidence quarantine changes
        env:
          OWNER: ky46738-ops
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ACTOR="${{ github.event.pull_request.user.login }}"
          else
            ACTOR="${{ github.actor }}"
          fi
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --pretty='' --name-only "$HEAD")
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          fi
          if echo "$CHANGED" | grep -q '^evidence-quarantine/' && [ "$ACTOR" != "$OWNER" ]; then
            echo "FAIL: evidence-quarantine changed by non-owner actor: $ACTOR"
            exit 1
          fi
          echo "PASS: evidence quarantine owner check"

      - name: Check no private data leaked
        run: |
          if grep -r "PRIVATE_ENGINE\|ENGINE_REGISTRY_PRIVATE" --include="*.md" --include="*.json" .; then
            echo "FAIL: Private markers found in public files"
            exit 1
          fi
          echo "PASS: No private data leaked"
