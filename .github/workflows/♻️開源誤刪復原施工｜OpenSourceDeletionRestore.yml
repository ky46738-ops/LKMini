name: ♻️開源誤刪復原施工

on:
  push:
    branches:
      - seed_v0
    paths:
      - '.restore/READY'
  pull_request:
    branches:
      - seed_v0
    paths:
      - '.restore/TRIGGER_PR'

permissions:
  contents: write
  pull-requests: read

jobs:
  restore:
    name: 🔬復原公開模組並完成驗證
    runs-on: ubuntu-latest
    steps:
      - name: 📥取得待復原提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: ♻️組裝並驗證安全復原增量
        shell: bash
        run: |
          cat \
            .restore/part00.txt \
            .restore/part01a.txt \
            .restore/part01b.txt \
            .restore/part02.txt \
            .restore/part03a1.txt \
            .restore/part03a211.txt \
            .restore/part03a21211.txt \
            .restore/part03a21212.txt \
            .restore/part03a2122.txt \
            .restore/part03a22.txt \
            .restore/part03b.txt \
            > /tmp/open-source-restore.b64
          echo 'e360cbbbfe3d18d57154616695840e54f4e2567aa9817a19f096f94e9205226a  /tmp/open-source-restore.b64' | sha256sum -c -
          base64 -d /tmp/open-source-restore.b64 > /tmp/open-source-restore.tar.gz
          echo '81d5850bdb934aee5d6c5ab7e89aa20f73f4b399107010239dc8c8c700a2f858  /tmp/open-source-restore.tar.gz' | sha256sum -c -
          tar -tzf /tmp/open-source-restore.tar.gz >/tmp/open-source-restore-members.txt
          test "$(wc -l </tmp/open-source-restore-members.txt)" -eq 25

      - name: 🧩展開安全復原增量
        shell: bash
        run: |
          tar -xzf /tmp/open-source-restore.tar.gz -C .
          rm -rf .restore
          rm -f '.github/workflows/♻️開源誤刪復原施工｜OpenSourceDeletionRestore.yml'

      - name: 🔬執行公開邊界與防誤刪驗證
        run: python tools/verify_lkmini.py

      - name: 🔐驗證全部公開檔案雜湊
        run: sha256sum -c SHA256SUMS

      - name: 🧾提交復原結果
        shell: bash
        run: |
          git config user.name 'Kevin'
          git config user.email '242197477+ky46738-ops@users.noreply.github.com'
          git add -A
          git commit -m '♻️完成九十一項開源刪除裁決與二十八模組復原'
          git push origin HEAD:seed_v0
