name: "🎩大管家｜Gatekeeper"
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in 📖入口宣告｜README.md ⚖️授權條款｜LICENSE ✍️作者歸屬｜NOTICE.md 🥃官方標誌｜LKMini.svg 🚧公私邊界｜PUBLIC_PRIVATE_BOUNDARY.md 🧾雜湊校驗清單｜SHA256SUMS .github/workflows/🎩大管家｜Gatekeeper.yml tools/🔍驗證工具｜verify_lkmini.py; do
            if [ ! -f "$f" ]; then
              echo "FAIL: Missing $f"
              exit 1
            fi
          done
          echo "PASS: All required files exist"

      - name: Check A=A marker
        run: |
          if ! grep -q "A_EQUALS_A=true" 📖入口宣告｜README.md; then
            echo "FAIL: A=A marker missing in 📖入口宣告｜README.md"
            exit 1
          fi
          echo "PASS: A=A marker found"

      - name: Verify 🧾雜湊校驗清單｜SHA256SUMS
        run: |
          sha256sum -c 🧾雜湊校驗清單｜SHA256SUMS
          echo "PASS: All hashes match"

      - name: Check no private data leaked
        run: |
          python3 tools/🔍驗證工具｜verify_lkmini.py
