name: ToolSpecifications Remaining Delivery
on:
  push:
    branches: [seed_v0]
    paths:
      - 'Delivery/ToolSpecificationsRemaining/**'
      - '.github/workflows/toolspec-remaining-delivery.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build delivery
        run: |
          python Delivery/ToolSpecificationsRemaining/build.py
          cp Delivery/ToolSpecificationsRemaining/final_state.json Delivery/ToolSpecificationsRemaining/out/✅終局狀態｜FinalState.json
      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolSpecificationsRemainingDelivery
          path: Delivery/ToolSpecificationsRemaining/out/
          if-no-files-found: error
          retention-days: 30
